name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install system packages
        run: |
          pacman -Syu --noconfirm --needed git curl python python-numpy nodejs npm shellcheck \
            qt6-base qt6-declarative qt6-multimedia qt6-svg qt6-wayland
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Cache Bend, Lean and the BendTT kernel
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/bend-*
            ~/.elan
            ~/.bend
          key: toolchain-${{ hashFiles('tools/versions.env') }}
      - name: Install the pinned toolchain
        run: bin/setup
      - name: Check
        env:
          # the commits this run must check for the Laws-Change rule
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          # the authored head, not the merge commit GitHub checks out for a PR
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bin/check "$BASE" "$HEAD_SHA"
